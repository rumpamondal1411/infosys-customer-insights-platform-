name: ShopSense CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint (flake8)
        run: |
          flake8 app --max-line-length=120 --extend-ignore=E203,W503 --exit-zero

      - name: Data validation checks
        run: |
          python -c "
          from app.database import init_db, SessionLocal
          init_db()
          from app.utils.seed_data import run
          run()
          from app.services.validation_service import validation_report
          db = SessionLocal()
          result = validation_report(db)
          print(result)
          "

      - name: Run analytics & unit tests (pytest)
        run: |
          pytest -v --maxfail=1

      - name: Smoke-test ETL pipeline
        run: |
          python -c "
          from app.database import init_db, SessionLocal
          init_db()
          from app.etl.pipeline import run_pipeline
          db = SessionLocal()
          result = run_pipeline(db, triggered_by='ci')
          print(result)
          assert result['status'] == 'success'
          "

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: shopsense:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
