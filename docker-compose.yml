version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shopsense
      POSTGRES_PASSWORD: shopsense
      POSTGRES_DB: shopsense
    volumes:
      - shopsense_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopsense"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://shopsense:shopsense@db:5432/shopsense
      MLFLOW_TRACKING_URI: sqlite:///./mlflow.db
      ENABLE_SCHEDULER: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./reports:/app/reports
      - ./mlruns:/app/mlruns
      - ./app/static/uploads:/app/app/static/uploads

volumes:
  shopsense_pgdata:
