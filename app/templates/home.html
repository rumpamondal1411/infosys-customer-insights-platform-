
<!DOCTYPE html>
<html>
<head>
    <title>ShopSense</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>

        *{ box-sizing:border-box; }

        body{
            font-family:'Segoe UI', Arial, sans-serif;
            margin:0;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            overflow-x:hidden;
            position:relative;
            background:linear-gradient(135deg,#0f1729,#1e2a4a,#0f1729);
            background-size:400% 400%;
            animation:gradientShift 20s ease infinite;
            padding:60px 20px;
        }

        @keyframes gradientShift{
            0%{ background-position:0% 50%; }
            50%{ background-position:100% 50%; }
            100%{ background-position:0% 50%; }
        }

        /* --- Live wallpaper: floating gradient orbs, one per role color --- */

        .orb{
            position:fixed;
            border-radius:50%;
            filter:blur(70px);
            opacity:0.4;
            pointer-events:none;
        }

        .orb1{
            width:460px; height:460px;
            background:radial-gradient(circle,#10b981,transparent 70%); /* customer green */
            top:-120px; left:-120px;
            animation:float1 15s ease-in-out infinite;
        }

        .orb2{
            width:420px; height:420px;
            background:radial-gradient(circle,#2563eb,transparent 70%); /* vendor blue */
            bottom:-140px; right:-100px;
            animation:float2 17s ease-in-out infinite;
        }

        .orb3{
            width:340px; height:340px;
            background:radial-gradient(circle,#f59e0b,transparent 70%); /* admin amber */
            top:45%; right:10%;
            animation:float3 13s ease-in-out infinite;
        }

        .orb4{
            width:280px; height:280px;
            background:radial-gradient(circle,#7c3aed,transparent 70%); /* brand violet */
            bottom:10%; left:8%;
            animation:float2 19s ease-in-out infinite;
        }

        @keyframes float1{
            0%,100%{ transform:translate(0,0) scale(1); }
            50%{ transform:translate(70px,90px) scale(1.1); }
        }

        @keyframes float2{
            0%,100%{ transform:translate(0,0) scale(1); }
            50%{ transform:translate(-60px,-70px) scale(1.15); }
        }

        @keyframes float3{
            0%,100%{ transform:translate(0,0) scale(1); }
            50%{ transform:translate(-50px,60px) scale(0.9); }
        }

        /* --- Floating particles --- */

        .particle{
            position:fixed;
            width:5px;
            height:5px;
            border-radius:50%;
            background:rgba(255,255,255,0.35);
            animation:drift linear infinite;
            pointer-events:none;
        }

        @keyframes drift{
            0%{ transform:translateY(0) translateX(0); opacity:0; }
            10%{ opacity:1; }
            90%{ opacity:1; }
            100%{ transform:translateY(-100vh) translateX(30px); opacity:0; }
        }

        /* --- Content --- */

        .wrap{
            position:relative;
            z-index:5;
            max-width:920px;
            width:100%;
            text-align:center;
        }

        .brand-icon{
            width:64px;
            height:64px;
            margin:0 auto 18px;
            border-radius:16px;
            background:linear-gradient(135deg,#2563eb,#7c3aed);
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:30px;
            box-shadow:0 10px 30px rgba(37,99,235,0.4);
        }

        h1{
            font-size:38px;
            margin:0 0 10px;
            color:#fff;
            letter-spacing:-0.5px;
        }

        p.subtitle{
            color:rgba(255,255,255,0.75);
            margin:0 0 48px;
            font-size:15px;
        }

        .cards{
            display:flex;
            gap:24px;
            justify-content:center;
            flex-wrap:wrap;
        }

        .role-card{
            width:240px;
            background:rgba(255,255,255,0.97);
            backdrop-filter:blur(10px);
            border-radius:16px;
            padding:38px 24px;
            box-shadow:0 12px 34px rgba(0,0,0,0.28);
            text-decoration:none;
            color:#111827;
            transition:.2s;
            border:1px solid rgba(255,255,255,0.4);
            animation:cardIn 0.6s ease backwards;
        }

        .role-card:nth-child(1){ animation-delay:.05s; }
        .role-card:nth-child(2){ animation-delay:.15s; }
        .role-card:nth-child(3){ animation-delay:.25s; }

        @keyframes cardIn{
            from{ opacity:0; transform:translateY(24px); }
            to{ opacity:1; transform:translateY(0); }
        }

        .role-card:hover{
            transform:translateY(-8px);
            box-shadow:0 20px 44px rgba(0,0,0,0.35);
        }

        .role-icon-wrap{
            width:64px;
            height:64px;
            margin:0 auto 16px;
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:30px;
        }

        .role-card.customer .role-icon-wrap{ background:linear-gradient(135deg,#10b981,#0891b2); }
        .role-card.vendor .role-icon-wrap{ background:linear-gradient(135deg,#2563eb,#4f46e5); }
        .role-card.admin .role-icon-wrap{ background:linear-gradient(135deg,#f59e0b,#dc2626); }

        .role-title{
            font-size:18px;
            font-weight:700;
            margin-bottom:6px;
        }

        .role-desc{
            font-size:13px;
            color:#6b7280;
            line-height:1.4;
        }

    </style>
</head>

<body>

<!-- Live animated wallpaper -->
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>
<div class="orb orb4"></div>
<div id="particles"></div>

<div class="wrap">

    <div class="brand-icon">🛒</div>
    <h1>ShopSense</h1>
    <p class="subtitle">Multi-Vendor E-Commerce Analytics Platform &mdash; choose how you'd like to sign in</p>

    <div class="cards">

        <a href="/customer-login" class="role-card customer">
            <div class="role-icon-wrap">🛍️</div>
            <div class="role-title">Customer</div>
            <div class="role-desc">Browse products from all vendors</div>
        </a>

        <a href="/login" class="role-card vendor">
            <div class="role-icon-wrap">🏪</div>
            <div class="role-title">Vendor</div>
            <div class="role-desc">Manage your products, inventory &amp; sales</div>
        </a>

        <a href="/admin-login" class="role-card admin">
            <div class="role-icon-wrap">🛠️</div>
            <div class="role-title">Admin</div>
            <div class="role-desc">Oversee vendors, catalogue &amp; marketplace analytics</div>
        </a>

    </div>

</div>

<script>

const particleContainer = document.getElementById("particles");
for (let i = 0; i < 36; i++) {
    const p = document.createElement("div");
    p.className = "particle";
    p.style.left = Math.random() * 100 + "vw";
    p.style.animationDuration = (10 + Math.random() * 14) + "s";
    p.style.animationDelay = (Math.random() * 12) + "s";
    particleContainer.appendChild(p);
}

</script>

</body>
</html>
