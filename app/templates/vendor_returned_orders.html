{% extends "base_vendor.html" %}

{% block title %}Returned Orders{% endblock %}
{% block heading %}Returned Orders{% endblock %}

{% block content %}

<div class="section-title">
    <h3>Returned Orders</h3>
    <button onclick="loadReturnedOrders()" class="btn btn-primary">🔄 Refresh</button>
</div>

<p id="returnedStatus" style="color:#2563eb; min-height:20px;"></p>

<table border="1" width="100%" cellpadding="10">
    <thead>
        <tr>
            <th>Order Ref</th>
            <th>Product</th>
            <th>Quantity</th>
            <th>Refund Amount</th>
            <th>Returned On</th>
            <th>Reason</th>
        </tr>
    </thead>
    <tbody id="returnedTable"></tbody>
</table>

<script>

const vendorId = localStorage.getItem("vendor_id");

async function loadReturnedOrders() {
    const statusEl = document.getElementById("returnedStatus");
    statusEl.textContent = "Loading...";

    try {
        const [txnRes, productRes] = await Promise.all([
            fetch(`/transactions?vendor_id=${vendorId}&limit=1000`),
            fetch(`/products?vendor_id=${vendorId}`),
        ]);
        if (!txnRes.ok) throw new Error(`transactions request failed (${txnRes.status})`);
        if (!productRes.ok) throw new Error(`products request failed (${productRes.status})`);

        const transactions = await txnRes.json();
        const products = await productRes.json();
        const productNameById = {};
        products.forEach(p => { productNameById[p.id] = p.name; });

        // A returned order carries status "refunded" (set once the return
        // is processed) — same field the analytics/reporting pipeline
        // already relies on to exclude returns from revenue.
        const returned = transactions.filter(t => t.status === "refunded");

        const tbody = document.getElementById("returnedTable");
        if (!returned.length) {
            tbody.innerHTML = `<tr><td colspan="6">No returned orders. 🎉</td></tr>`;
        } else {
            tbody.innerHTML = returned.map(t => `
                <tr>
                    <td>${t.order_ref ?? t.id}</td>
                    <td>${productNameById[t.product_id] ?? ("Product #" + t.product_id)}</td>
                    <td>${t.quantity}</td>
                    <td>₹ ${t.total_amount}</td>
                    <td>${t.returned_at ? new Date(t.returned_at).toLocaleString() : "—"}</td>
                    <td>${t.return_reason ?? "Not provided"}</td>
                </tr>
            `).join("");
        }

        statusEl.textContent = `${returned.length} returned order(s) — updated ${new Date().toLocaleTimeString()}`;
    } catch (err) {
        statusEl.textContent = `Failed to load returned orders: ${err.message}`;
        document.getElementById("returnedTable").innerHTML =
            `<tr><td colspan="6" style="color:#dc2626;">Could not load returned orders. Check your connection and refresh.</td></tr>`;
    }
}

loadReturnedOrders();

</script>

{% endblock %}
