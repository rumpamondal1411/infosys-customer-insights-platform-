
<!DOCTYPE html>
<html>
<head>
    <title>Customer Login — ShopSense</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>

        *{ box-sizing:border-box; }

        body{
            margin:0;
            font-family:'Segoe UI', Arial, sans-serif;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            overflow:hidden;
            position:relative;
            background:linear-gradient(135deg,#08201a,#0f3d30,#08201a);
            background-size:400% 400%;
            animation:gradientShift 18s ease infinite;
        }

        @keyframes gradientShift{
            0%{ background-position:0% 50%; }
            50%{ background-position:100% 50%; }
            100%{ background-position:0% 50%; }
        }

        /* --- Live wallpaper: floating gradient orbs (teal/green = customer/shopping) --- */

        .orb{
            position:absolute;
            border-radius:50%;
            filter:blur(60px);
            opacity:0.45;
            pointer-events:none;
        }

        .orb1{
            width:420px; height:420px;
            background:radial-gradient(circle,#10b981,transparent 70%);
            top:-100px; left:-100px;
            animation:float1 14s ease-in-out infinite;
        }

        .orb2{
            width:380px; height:380px;
            background:radial-gradient(circle,#0891b2,transparent 70%);
            bottom:-120px; right:-80px;
            animation:float2 16s ease-in-out infinite;
        }

        .orb3{
            width:300px; height:300px;
            background:radial-gradient(circle,#22c55e,transparent 70%);
            top:40%; right:15%;
            animation:float3 12s ease-in-out infinite;
        }

        @keyframes float1{
            0%,100%{ transform:translate(0,0) scale(1); }
            50%{ transform:translate(60px,80px) scale(1.1); }
        }

        @keyframes float2{
            0%,100%{ transform:translate(0,0) scale(1); }
            50%{ transform:translate(-50px,-60px) scale(1.15); }
        }

        @keyframes float3{
            0%,100%{ transform:translate(0,0) scale(1); }
            50%{ transform:translate(-40px,50px) scale(0.9); }
        }

        /* --- Floating particles --- */

        .particle{
            position:absolute;
            width:5px;
            height:5px;
            border-radius:50%;
            background:rgba(255,255,255,0.35);
            animation:drift linear infinite;
        }

        @keyframes drift{
            0%{ transform:translateY(0) translateX(0); opacity:0; }
            10%{ opacity:1; }
            90%{ opacity:1; }
            100%{ transform:translateY(-100vh) translateX(30px); opacity:0; }
        }

        /* --- Login card --- */

        .login-card{
            position:relative;
            z-index:5;
            width:380px;
            max-width:90vw;
            background:rgba(255,255,255,0.97);
            backdrop-filter:blur(10px);
            padding:40px 36px 32px;
            border-radius:18px;
            box-shadow:0 20px 60px rgba(0,0,0,0.35);
            animation:cardIn 0.6s ease;
        }

        @keyframes cardIn{
            from{ opacity:0; transform:translateY(20px); }
            to{ opacity:1; transform:translateY(0); }
        }

        .brand{
            text-align:center;
            margin-bottom:8px;
        }

        .brand-icon{
            width:56px;
            height:56px;
            margin:0 auto 12px;
            border-radius:14px;
            background:linear-gradient(135deg,#10b981,#0891b2);
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:26px;
        }

        h2{
            text-align:center;
            margin:0 0 4px;
            color:#111827;
            font-size:22px;
        }

        .subtext{
            text-align:center;
            color:#6b7280;
            font-size:13px;
            margin:0 0 26px;
        }

        label{
            display:block;
            font-size:12.5px;
            font-weight:600;
            color:#374151;
            margin-bottom:6px;
        }

        .field{
            margin-bottom:16px;
        }

        input{
            width:100%;
            padding:12px 14px;
            border:1px solid #d1d5db;
            border-radius:9px;
            font-size:14px;
            background:#fafafa;
            transition:border-color .15s, background .15s;
        }

        input:focus{
            outline:none;
            border-color:#10b981;
            background:#fff;
        }

        button{
            width:100%;
            padding:13px;
            background:linear-gradient(135deg,#10b981,#0891b2);
            color:white;
            border:none;
            border-radius:9px;
            font-size:15px;
            font-weight:600;
            cursor:pointer;
            margin-top:6px;
            transition:opacity .15s, transform .1s;
        }

        button:hover{
            opacity:0.92;
        }

        button:active{
            transform:scale(0.98);
        }

        .links{
            text-align:center;
            margin-top:20px;
            font-size:13px;
        }

        a{
            text-decoration:none;
            color:#10b981;
        }

        a:hover{
            text-decoration:underline;
        }

        .back-link{
            display:block;
            margin-top:10px;
            color:#9ca3af !important;
            font-size:12.5px;
        }

    </style>
</head>

<body>

<!-- Live animated wallpaper -->
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>
<div id="particles"></div>

<div class="login-card">

    <div class="brand">
        <div class="brand-icon">🛍️</div>
        <h2>Customer Login</h2>
        <p class="subtext">Sign in to shop on ShopSense</p>
    </div>

    <form id="loginForm">

        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" required>
        </div>

        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <button type="submit">Login</button>

    </form>

    <div class="links">
        <a href="/customer-register">Create New Account</a>
        <a href="/" class="back-link">← Back to role selection</a>
    </div>

</div>

<script>

const particleContainer = document.getElementById("particles");
for (let i = 0; i < 30; i++) {
    const p = document.createElement("div");
    p.className = "particle";
    p.style.left = Math.random() * 100 + "vw";
    p.style.animationDuration = (10 + Math.random() * 12) + "s";
    p.style.animationDelay = (Math.random() * 10) + "s";
    particleContainer.appendChild(p);
}

document.getElementById("loginForm").addEventListener("submit",async function(e){

e.preventDefault();

const response=await fetch("/customer/login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

email:document.getElementById("email").value,

password:document.getElementById("password").value

})

});

const data=await response.json();

if(response.ok){

localStorage.setItem("customer_id", data.customer_id);
localStorage.setItem("customer_name", data.name);

alert("Login Successful");

window.location="/customer-dashboard";

}

else{

alert(data.detail);

}

});

</script>

</body>
</html>
